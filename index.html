<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login - StudentPlanner</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    height: 100vh;
    background: radial-gradient(circle at top, #1f2937, #0f172a);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* CARD */
.login-card {
    background: rgba(42,42,42,0.9);
    border: none;
    border-radius: 20px;
    backdrop-filter: blur(10px);
    color: white;
}

/* TITLE */
.login-card h3 {
    color: #ffffff;
}

/* SUBTEXT */
.login-subtext {
    color: #ffffff;
    font-weight: 500;
    margin-bottom: 15px;
}

/* INPUT */
.form-control {
    background: #1e1e1e !important;
    border: 1px solid #333 !important;
    color: #ffffff !important;
}


/* PLACEHOLDER */
.form-control::placeholder {
    color: #cccccc !important;
}

/* FOCUS */
.form-control:focus {
    background: #1e1e1e !important;
    color: #ffffff !important;
    border-color: #22c55e !important;
    box-shadow: none;
}

/* BUTTON */
.btn-success {
    border-radius: 10px;
}

.text-muted {
    color: #bbbbbb !important;
}
</style>

</head>

<body>

<div class="container">
    <div class="row justify-content-center">

        <div class="col-md-4">

            <div class="card login-card p-4 shadow-lg">

                <h3 class="text-center mb-3">📘 StudentPlanner</h3>
                <p class="login-subtext text-center">
                Welcome! Please enter your username and password</p>

                <input type="text" id="username" class="form-control mb-3" placeholder="Username">
                <input type="password" id="password" class="form-control mb-3" placeholder="Password">
                <p id="errorMsg" style="color:red; display:none;">Invalid login</p>
                <button onclick="login()" class="btn btn-success w-100">Login</button>

                <small class="text-center mt-3 d-block" style="color:#bbb;">
                    Use: admin / 123
                </small>

            </div>

        </div>

    </div>
</div>

<script>
function login(){
    const user = document.getElementById("username").value;
    const pass = document.getElementById("password").value;

    if(user === "admin" && pass === "123"){
        localStorage.setItem("login", "true");
        localStorage.setItem("username", user);
        window.location = "dashboard.html";
    } else {
       document.getElementById("errorMsg").style.display = "block";
    }
}

</script>
</body>
</html>
